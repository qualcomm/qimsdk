[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qimsdk"
version = "0.1.0"
description = "Python bindings and helpers for IMSDK"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0"
]

[tool.setuptools]
packages = ["qimsdk"]
