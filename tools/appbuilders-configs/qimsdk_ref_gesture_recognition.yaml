pipeline:
  elements:
    - type: qtiqmmfsrc
      name: src

    - type: filter
      name: videostream
      video:
        format: NV12
        width: 1920
        height: 1080
        framerate: 30

    - type: tee
      name: split1

    - type: queue
      name: q1

    - type: queue
      name: q2

    - type: qtimlvconverter
      name: stage_01_preprocessing

    - type: queue
      name: q3

    - type: qtimltflite
      name: stage_01_inferencing
      delegate: gpu
      model: $HOME/Downloads/qimsdk_samples/models/palm_detection_full.tflite

    - type: qtimlpostprocess
      name: stage_01_postprocessing
      module: palmd
      labels: $HOME/Downloads/qimsdk_samples/labels/palmd_labels.json
      settings: $HOME/Downloads/qimsdk_samples/labels/palmd_settings.json

    - type: filter
      name: mlf_01
      text: {}

    - type: qtimetamux
      name: mlmuxer1

    - type: queue
      name: q11

    - type: qtimetatransform
      name: metatransform
      module: roi-palmd

    - type: tee
      name: split2

    - type: queue
      name: q4

    - type: queue
      name: q5

    - type: qtimetamux
      name: mlmuxer2

    - type: queue
      name: q12

    - type: qtivoverlay
      name: overlay

    - type: waylandsink
      name: display
      sync: false
      fullscreen: true

    - type: qtimlvconverter
      name: stage_02_preprocessing
      mode: roi-batch-cumulative

    - type: queue
      name: q6

    - type: qtimltflite
      name: stage_02_inferencing
      delegate: xnnpack
      model: $HOME/Downloads/qimsdk_samples/models/hand_landmark_full.tflite

    - type: tee
      name: split3

    - type: queue
      name: q7
    - type: queue
      name: q8
    - type: queue
      name: q9
    - type: queue
      name: q10

    - type: qtimlpostprocess
      name: stage_02_1_postprocessing
      module: hlandmark
      labels: $HOME/Downloads/qimsdk_samples/labels/hlandmarks.json
      settings: $HOME/Downloads/qimsdk_samples/labels/hlandmark_settings.json

    - type: filter
      name: mlf_02
      text: {}

    - type: qtimlpostprocess
      name: stage_02_2_postprocessing
      module: tensor

    - type: qtimltflite
      name: stage_03_1_inferencing
      delegate: gpu
      model: $HOME/Downloads/qimsdk_samples/models/gesture_embedder.tflite

    - type: qtimltflite
      name: stage_03_2_inferencing
      delegate: gpu
      model: $HOME/Downloads/qimsdk_samples/models/canned_gesture_classifier.tflite

    - type: qtimlpostprocess
      name: stage_03_postprocessing
      module: mobilenet
      labels: $HOME/Downloads/qimsdk_samples/labels/gesture_rec.json

    - type: filter
      name: mlf_03
      text: {}

  links:
    - [src, videostream, split1]
    - [split1, mlmuxer1, q11, metatransform, split2]
    - [split1, q2, stage_01_preprocessing, q3, stage_01_inferencing, q1, stage_01_postprocessing, mlf_01, mlmuxer1]
    - [split2, mlmuxer2, q12, overlay, display]
    - [split2, q5, stage_02_preprocessing, q6, stage_02_inferencing, split3]
    - [split3, q7, stage_02_1_postprocessing, mlf_02, mlmuxer2]
    - [split3, q8, stage_02_2_postprocessing, q9, stage_03_1_inferencing, q10, stage_03_2_inferencing, q4, stage_03_postprocessing, mlf_03, mlmuxer2]
